name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TQDM_DISABLE: "1"
  FORCE_COLOR: "1"

jobs:
  setup-matrix:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'matrix={"os": ["ubuntu-latest"], "python-version": ["3.10", "3.12"]}' >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo 'matrix={"os": ["ubuntu-latest"], "python-version": ["3.9", "3.10", "3.11", "3.12", "3.13"]}' >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'matrix={"os": ["ubuntu-latest", "windows-latest", "macos-latest"], "python-version": ["3.10", "3.12"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"os": ["ubuntu-latest"], "python-version": ["3.10", "3.12"]}' >> $GITHUB_OUTPUT
          fi

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependencies
        run: |
          pip install pre-commit "ruff==0.15.10"  # keep in sync with .pre-commit-config.yaml
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run mypy
        # Same invocation as release.yml and local runs; configuration
        # (including the strictness ratchet) lives in pyproject.toml.
        run: mypy trustlens/

  tests:
    name: Test ${{ matrix.os }} / ${{ matrix.python-version }}
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install OpenMP (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install libomp || true

          # XGBoost looks in specific paths depending on how the wheel was built.
          # Ensure libomp.dylib is discoverable in all typical locations.
          sudo mkdir -p /opt/homebrew/opt/libomp/lib
          sudo mkdir -p /usr/local/opt/libomp/lib

          # Find where brew actually installed it
          ACTUAL_LIBOMP=$(brew --prefix libomp)/lib/libomp.dylib

          sudo ln -sf $ACTUAL_LIBOMP /opt/homebrew/opt/libomp/lib/libomp.dylib
          sudo ln -sf $ACTUAL_LIBOMP /usr/local/opt/libomp/lib/libomp.dylib
          sudo ln -sf $ACTUAL_LIBOMP /usr/local/lib/libomp.dylib
      - name: Install dependencies
        run: |
          pip install -e ".[dev,full]"
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=trustlens --cov-report=xml --junitxml=junit.xml -v
      - name: Run docstring examples
        run: |
          pytest trustlens --doctest-modules --import-mode=importlib -p no:cacheprovider -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: runner.os == 'Linux'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  dependency-compat:
    name: Dependency Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install minimum dependencies
        run: |
          pip install .
          pip install numpy==1.23 scikit-learn==1.2 matplotlib==3.6 scipy==1.9
      - name: Smoke test
        run: |
          python -c "import trustlens; from trustlens import quick_analyze; quick_analyze(dataset='iris')"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install .[dev,full,docs]
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Check pip-audit ignore list
        # Every ignored vulnerability needs a reason and an expiry date; an
        # expired entry fails the job so it gets re-reviewed (TL-24).
        run: python scripts/check_audit_ignores.py .github/pip-audit-ignore.txt
      - name: Run pip-audit
        run: |
          # Upgrade packages with known fixes before auditing.
          pip install --upgrade "mistune>=3.2.1" "setuptools>=83.0.0"
          pip-audit $(python scripts/check_audit_ignores.py --flags .github/pip-audit-ignore.txt)

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install docs dependencies
        run: pip install -e ".[docs]"
      - name: Build docs (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  examples:
    name: Example Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run examples from an empty working directory
        # Examples must not depend on pre-existing output folders (TL-20).
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          for script in "$GITHUB_WORKSPACE"/examples/*.py "$GITHUB_WORKSPACE"/demo.py; do
            echo "::group::$(basename "$script")"
            python "$script"
            echo "::endgroup::"
          done

  build:
    name: Build Validation
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Check wheel contents
        # Only the trustlens package may be installed (GB-03).
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          tops = {n.split("/")[0] for n in zipfile.ZipFile(wheel).namelist()}
          extra = {t for t in tops if t != "trustlens" and not t.endswith(".dist-info")}
          assert not extra, f"unexpected top-level entries in wheel: {sorted(extra)}"
          PY
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Smoke test
        run: |
          python -c "import trustlens; from trustlens import analyze, quick_analyze; quick_analyze(dataset='iris')"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
