# Frozen audit evidence (audit/<date>/repro) is kept as recorded (only output paths redirected to a temp dir).
exclude: ^audit/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # No extra flags: use the [tool.mypy] configuration in pyproject.toml,
        # the same one CI and release run (GB drift finding).
        args: []
        additional_dependencies: [numpy, types-setuptools]
